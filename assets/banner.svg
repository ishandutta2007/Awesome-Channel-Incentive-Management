<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent glowing gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Card border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <style>
      @keyframes floatParticle {
        0% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(-15px) scale(1.1); opacity: 0.7; }
        100% { transform: translateY(0px) scale(1); opacity: 0.3; }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.6; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      @keyframes shimmerLine {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .bg-glow {
        transform-origin: center;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
      .particle-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
      .flow-line {
        stroke-dasharray: 200;
        animation: shimmerLine 8s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect width="1000" height="320" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Background Animated Elements (Low Opacity Behind Text) -->
  <g class="bg-glow" opacity="0.4">
    <circle cx="850" cy="80" r="180" fill="#38bdf8" filter="blur(60px)" opacity="0.15"/>
    <circle cx="150" cy="240" r="160" fill="#c084fc" filter="blur(60px)" opacity="0.15"/>
  </g>

  <!-- Network / Flow Graphic Lines (Background) -->
  <g opacity="0.25" stroke="url(#accentGrad)" stroke-width="1.5" fill="none">
    <path d="M 50 260 Q 250 180 450 250 T 850 140" class="flow-line"/>
    <path d="M 100 80 Q 350 150 600 70 T 950 200" class="flow-line"/>
  </g>

  <!-- Floating Decorative Nodes (Background) -->
  <g fill="#38bdf8">
    <circle cx="780" cy="90" r="4" class="particle-1"/>
    <circle cx="880" cy="180" r="6" class="particle-2"/>
    <circle cx="700" cy="230" r="5" class="particle-3"/>
    <circle cx="200" cy="70" r="5" class="particle-2"/>
    <circle cx="120" cy="180" r="4" class="particle-1"/>
  </g>

  <!-- Foreground Content Group (Always Sharp & Visible) -->
  <!-- Top Tag / Pill -->
  <g transform="translate(60, 45)">
    <rect width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
    <text x="140" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">
      ⚡ REBATES • SPIFs • MDF • PRM
    </text>
  </g>

  <!-- Main Title -->
  <text x="60" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Awesome Channel Incentive Management
  </text>

  <!-- Subtitle -->
  <text x="60" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    Curated SaaS Platforms, Partner Rebate Ecosystems &amp; Open-Source Rules Engines
  </text>

  <!-- Metric Badges Row (Foreground) -->
  <g transform="translate(60, 205)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="160" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">MARKET SIZE</text>
      <text x="20" y="44" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">$3.2B – $6.5B</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(175, 0)">
      <rect width="170" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">SECTOR STRUCTURE</text>
      <text x="20" y="44" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="700">Moderately Fragmented</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(360, 0)">
      <rect width="165" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">KEY CATEGORIES</text>
      <text x="20" y="44" fill="#c084fc" font-family="sans-serif" font-size="15" font-weight="700">SaaS &amp; Open Rules</text>
    </g>

    <!-- Badge 4 -->
    <g transform="translate(540, 0)">
      <rect width="145" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">LAST UPDATED</text>
      <text x="20" y="44" fill="#4ade80" font-family="sans-serif" font-size="15" font-weight="700">September 2026</text>
    </g>
  </g>
</svg>
